services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webkit}
      POSTGRES_DB: ${POSTGRES_DB:-webkit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webkit}:${POSTGRES_PASSWORD:-webkit}@db:5432/${POSTGRES_DB:-webkit}
      SESSION_SECRET: ${SESSION_SECRET}
      SITE_NAME: ${SITE_NAME}
      SITE_URL: ${SITE_URL}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/uploads:ro
    depends_on:
      - app

  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-webkit}
      PGPASSWORD: ${POSTGRES_PASSWORD:-webkit}
      PGDATABASE: ${POSTGRES_DB:-webkit}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
